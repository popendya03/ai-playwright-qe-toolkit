<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumina Pay - Login</title>
  <style>
    :root {
      --indigo: #4f46e5;
      --indigo-dark: #3730a3;
      --teal: #14b8a6;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    /* Left side: brand panel */
    .brand {
      background: linear-gradient(135deg, var(--indigo-dark), var(--indigo) 55%, var(--teal));
      color: #fff;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
    .logo-mark {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      display: grid; place-items: center;
    }
    .brand h2 { font-size: 36px; line-height: 1.2; margin: 0 0 16px; }
    .brand p { margin: 0; max-width: 420px; line-height: 1.6; opacity: 0.85; }
    .brand small { opacity: 0.7; }

    /* Right side: login card */
    .panel { display: flex; align-items: center; justify-content: center; padding: 32px; }
    .card {
      width: 100%; max-width: 400px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .card h1 { margin: 0 0 6px; font-size: 26px; }
    .subtitle { margin: 0 0 28px; color: var(--muted); font-size: 14px; }

    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--indigo);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--indigo-dark); }

        .link {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--indigo);
      text-decoration: none;
    }
    .link:hover { text-decoration: underline; }

    /* Success / error messages */
    .message { margin-top: 18px; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
    .message[hidden] { display: none; }
    .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }

    /* Small screens: hide the brand panel */
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; }
      .brand { display: none; }
    }
  </style>
</head>
<body>
  <section class="brand">
    <div class="logo"><span class="logo-mark">L</span> Lumina Pay</div>
    <div>
      <h2>Money, made simple.</h2>
      <p>Send, save and track your spending in one place. Fast, clear and built for everyday life.</p>
    </div>
    <small>Demo app for test automation practice. Not a real bank.</small>
  </section>

  <main class="panel">
    <div class="card">
      <h1>Log in</h1>
      <p class="subtitle">Welcome back. Enter your details to continue.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required data-testid="login-email" placeholder="you@example.com" />

        <label for="password">Password</label>
        <input id="password" type="password" data-testid="login-password" placeholder="Enter your password" />

        <button type="submit" data-testid="login-submit">Log in</button>
         <a class="link" href="forgot-password.html" data-testid="forgot-password-link">Forgot your password?</a>
      </form>

      <p id="error" class="message error" role="alert" data-testid="login-error" hidden>Invalid credentials</p>
      <p id="success" class="message success" data-testid="login-success" hidden>Welcome back!</p>
    </div>
  </main>

  <script>
    const VALID_EMAIL = 'user@example.com';
    const VALID_PASSWORD = 'correct-password';

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      const success = document.getElementById('success');

      error.hidden = true;
      success.hidden = true;

      if (email === VALID_EMAIL && password === VALID_PASSWORD) {
        success.hidden = false;
      } else {
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
